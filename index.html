<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>joule AI — less managing, more doing</title>
  <meta name="description" content="joule AI, less managing, more doing. coming soon — join the waitlist.">
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:title" content="joule AI">
  <meta property="og:description" content="less managing, more doing. coming soon.">
  <meta property="og:url" content="https://jouleai.vercel.app">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #ecebe6;
      --muted: #8a8984;
      --line: #2a2a2c;
      --card: #141415;
      --ease: cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 20px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 64px 0 24px;
      animation: rise 1.2s var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    h1 {
      display: flex;
      align-items: center;
      gap: .5em;
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(52px, 13vw, 96px);
      line-height: 1;
      letter-spacing: -.03em;
      transform: translateX(-.25em);
      transition: font-size .6s var(--ease);
    }
    h1 svg { height: .46em; width: auto; flex: none; transform: translateY(.06em); }
    .tagline {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: clamp(22px, 4.5vw, 30px);
      color: var(--muted);
      margin-top: 30px;
    }
    .badge {
      font-size: 13px;
      letter-spacing: .02em;
      color: var(--muted);
      margin-top: 48px;
    }
    /* compact hero once the survey is open */
    body.surveying h1 { font-size: clamp(32px, 8vw, 44px); }
    body.surveying .tagline, body.surveying .badge { display: none; }
    body.surveying main { justify-content: flex-start; padding-top: 48px; }

    #waitlist {
      margin-top: 20px;
      width: 100%;
      max-width: 360px;
      display: flex;
      border-bottom: 1px solid var(--line);
      transition: border-color .3s;
    }
    #waitlist:focus-within { border-color: var(--fg); }
    #waitlist input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--fg);
      font: inherit;
      font-size: 16px;
      padding: 14px 4px;
    }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    button {
      background: transparent;
      border: 0;
      font: inherit;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s, background .2s, border-color .2s, opacity .2s;
    }
    button:hover { color: var(--fg); }
    button:disabled { cursor: default; }
    #waitlist button { font-size: 14px; padding: 14px 4px 14px 16px; }
    .honey { position: absolute; left: -9999px; }
    .status {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
    }
    .status.ok { color: var(--fg); }

    /* ---------- survey ---------- */
    #survey {
      display: none;
      width: 100%;
      max-width: 560px;
      margin-top: 36px;
      text-align: left;
    }
    #survey.open { display: block; animation: rise .8s var(--ease) both; }
    .progress { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
    .bar { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .5s var(--ease); }
    .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }

    .stage { transition: opacity .22s ease, transform .22s ease; }
    .stage.out { opacity: 0; transform: translateY(-10px); }
    .stage.in { opacity: 0; transform: translateY(10px); transition: none; }

    .qtitle {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(26px, 5.5vw, 34px);
      line-height: 1.15;
      letter-spacing: -.01em;
    }
    .qhint { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 24px;
    }
    .options.single-col { grid-template-columns: 1fr; }
    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      font-size: 14px;
      color: var(--fg);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      white-space: normal;
    }
    .opt:hover { border-color: #4a4a4c; color: var(--fg); }
    .opt kbd {
      flex: none;
      display: grid;
      place-items: center;
      width: 22px; height: 22px;
      font: 400 11px "Inter", sans-serif;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      transition: inherit;
    }
    .opt[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .opt[aria-pressed="true"] kbd { color: var(--bg); border-color: rgba(0,0,0,.25); }
    .opt.pop { animation: pop .25s var(--ease); }
    @keyframes pop { 50% { transform: scale(.97); } }

    .other {
      display: none;
      width: 100%;
      margin-top: 12px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      outline: 0;
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      padding: 10px 2px;
      resize: none;
      transition: border-color .3s;
    }
    .other.show { display: block; animation: rise .4s var(--ease) both; }
    .other:focus { border-color: var(--fg); }
    textarea.other { min-height: 96px; margin-top: 20px; }

    .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 32px; }
    .nav .left { display: flex; gap: 20px; }
    .nav button { font-size: 14px; padding: 8px 0; }
    .next {
      color: var(--bg) !important;
      background: var(--fg);
      border-radius: 999px;
      padding: 10px 22px !important;
    }
    .next:hover { opacity: .85; }
    .next:disabled { opacity: .3; }
    .next small { font-size: 11px; opacity: .55; margin-left: 8px; }
    [hidden] { display: none !important; }

    .done { text-align: center; padding: 40px 0; }
    .done p { color: var(--muted); font-size: 14px; margin-top: 10px; }

    @media (max-width: 480px) {
      .options { gap: 6px; margin-top: 20px; }
      .opt { font-size: 13px; padding: 11px 12px; border-radius: 10px; min-height: 48px; }
      .next small, .opt kbd { display: none; }
      .progress { margin-bottom: 28px; }
    }

    footer {
      text-align: center;
      padding: 28px 0;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1 aria-label="joule AI">
      <svg viewBox="0 0 99 42" aria-hidden="true"><rect x="0" y="12" width="19" height="18" rx="4" fill="#545454"/><rect x="29" y="8" width="30" height="26" rx="6" fill="#9d9d9d"/><rect x="57" y="0" width="42" height="42" rx="10" fill="currentColor"/></svg>
      <span>joule AI</span>
    </h1>
    <p class="tagline">less managing, more doing</p>
    <p class="badge">coming soon</p>

    <form id="waitlist" novalidate>
      <label for="email" class="honey">email</label>
      <input id="email" name="email" type="email" placeholder="your email" autocomplete="email" required>
      <input class="honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">join waitlist</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section id="survey" aria-live="polite">
      <div class="progress"><div class="bar"><i id="bar"></i></div><span class="count" id="count"></span></div>
      <div class="stage" id="stage"></div>
    </section>
  </main>

  <footer>
    <a href="mailto:tryjoule.ai@gmail.com">tryjoule.ai@gmail.com</a>
  </footer>

  <script>
    const ENDPOINT = "https://formsubmit.co/ajax/tryjoule.ai@gmail.com";

    // type: "one" = pick one (auto-advances), "many" = pick any (or up to max), "text" = free writing.
    // other: true lets people write their own answer.
    const QUESTIONS = [
      { id: "role", type: "one", title: "what best describes you?",
        options: ["student", "founder", "engineer / designer", "manager", "freelancer / creator", "other"], other: true },
      { id: "browser", type: "one", title: "which browser do you use most?",
        options: ["chrome", "safari", "arc", "brave", "edge / firefox", "other"], other: true },
      { id: "blockers", type: "many", title: "what gets in the way the most?", hint: "pick up to 3", max: 3,
        options: ["distractions & social media", "too many tabs & apps", "procrastination", "unclear priorities", "meetings & messages", "forgetting things", "other"], other: true },
      { id: "past_apps", type: "many", title: "why haven't productivity apps stuck for you?", hint: "pick all that apply",
        options: ["too much setup", "i forget to use them", "too complicated", "don't connect to my other apps", "never really tried one", "one works fine for me", "other"], other: true },
      { id: "features", type: "many", title: "what should joule do for you?", hint: "pick up to 3", max: 3,
        options: ["plan my day for me", "block distractions", "prioritise my tasks", "summarise emails & messages", "remind me at the right time", "an AI that acts across my apps", "other"], other: true },
      { id: "price", type: "one", title: "if joule nailed it, what would you pay?",
        options: ["free only", "under $5 / month", "$5–10 / month", "$10+ / month"] },
    ];

    const $ = (id) => document.getElementById(id);
    const form = $("waitlist"), status = $("status"), survey = $("survey"), stage = $("stage");
    const KEYS = "abcdefghijklmnopqrstuvwxyz";
    const answers = {}; // id -> { picks: [], other: "" }
    let email = "", step = 0, sending = false, moving = false, firstRender = true;

    async function send(payload) {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ _template: "table", ...payload }),
      });
      const data = await res.json();
      if (!res.ok || String(data.success) !== "true") throw new Error(data.message);
    }

    // ---------- waitlist ----------
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const value = form.email.value.trim();
      const button = form.querySelector("button");
      status.className = "status";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) { status.textContent = "please enter a valid email"; return; }
      if (form._honey.value) return; // bot

      button.disabled = true;
      status.textContent = "joining…";
      try {
        await send({ email: value, _subject: "New JouleAI waitlist signup", _replyto: value });
        email = value;
        form.style.display = "none";
        status.className = "status ok";
        status.textContent = "you're on the list. 6 quick taps to help shape joule?";
        startSurvey();
      } catch (err) {
        status.textContent = "something went wrong. please try again.";
        console.error(err);
      } finally {
        button.disabled = false;
      }
    });

    // ---------- survey ----------
    function startSurvey() {
      document.body.classList.add("surveying");
      survey.classList.add("open");
      render();
    }

    const current = () => QUESTIONS[step];
    const state = (q) => (answers[q.id] ||= { picks: [], other: "" });

    function render() {
      const q = current(), s = state(q);
      const last = step === QUESTIONS.length - 1;
      $("bar").style.width = `${(step / QUESTIONS.length) * 100}%`;
      $("count").textContent = `${step + 1} / ${QUESTIONS.length}`;

      let body = `<h2 class="qtitle">${q.title}</h2>`;
      if (q.hint) body += `<p class="qhint">${q.hint}</p>`;
      if (q.type === "text") {
        body += `<textarea class="other show" id="otherInput" placeholder="${q.placeholder || ""}"></textarea>`;
      } else {
        const cols = q.options.length <= 6 ? " single-col" : "";
        body += `<div class="options${cols}">` + q.options.map((o, i) =>
          `<button type="button" class="opt" data-value="${o}" aria-pressed="${s.picks.includes(o)}"><kbd>${KEYS[i]}</kbd><span>${o}</span></button>`
        ).join("") + `</div>`;
        if (q.other) body += `<input class="other${s.picks.includes("other") ? " show" : ""}" id="otherInput" type="text" placeholder="write your own…">`;
      }
      body += `<div class="nav">
        <div class="left">
          <button type="button" id="back"${step === 0 ? " hidden" : ""}>← back</button>
          <button type="button" id="skip">skip</button>
        </div>
        <button type="button" class="next" id="next">${last ? "finish" : "next"}<small>enter ↵</small></button>
      </div>`;

      transition(() => {
        stage.innerHTML = body;
        if (survey.getBoundingClientRect().top < 0) survey.scrollIntoView({ behavior: "smooth" });
        const other = $("otherInput");
        if (other) {
          other.value = s.other;
          other.addEventListener("input", () => { s.other = other.value; updateNext(); });
          other.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey && !$("next").disabled) { e.preventDefault(); advance(); }
          });
          if (q.type === "text") setTimeout(() => other.focus(), 50);
        }
        stage.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => pick(b.dataset.value)));
        $("back").addEventListener("click", back);
        $("skip").addEventListener("click", () => { delete answers[q.id]; advance(); });
        $("next").addEventListener("click", advance);
        updateNext();
      });
    }

    function transition(swap) {
      if (firstRender) { firstRender = false; swap(); return; }
      moving = true;
      stage.classList.add("out");
      setTimeout(() => {
        swap();
        stage.classList.remove("out");
        stage.classList.add("in");
        requestAnimationFrame(() => requestAnimationFrame(() => { stage.classList.remove("in"); moving = false; }));
      }, 200);
    }

    // next is enabled once something is picked (or written); skip is always there
    function updateNext() {
      const q = current(), s = state(q), btn = $("next");
      if (!btn) return;
      const wroteOther = s.other.trim() !== "";
      let ok = q.type === "text" || s.picks.length > 0;
      if (q.type === "one" && s.picks[0] === "other") ok = wroteOther;
      btn.disabled = !ok;
    }

    function pick(value) {
      if (moving) return;
      const q = current(), s = state(q);
      if (q.type === "one") {
        s.picks = [value];
      } else if (s.picks.includes(value)) {
        s.picks = s.picks.filter((p) => p !== value);
      } else {
        s.picks = value === "none" ? [] : s.picks.filter((p) => p !== "none");
        if (q.max && s.picks.length >= q.max) s.picks.shift();
        s.picks.push(value);
      }
      stage.querySelectorAll(".opt").forEach((b) => {
        if (b.dataset.value === value) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
        b.setAttribute("aria-pressed", s.picks.includes(b.dataset.value));
      });
      const other = $("otherInput");
      if (other) {
        const show = s.picks.includes("other");
        other.classList.toggle("show", show);
        if (show && value === "other") setTimeout(() => other.focus(), 30);
      }
      updateNext();
      if (q.type === "one" && value !== "other") { moving = true; setTimeout(() => { moving = false; advance(); }, 260); }
    }

    function back() { if (!moving && step > 0) { step--; render(); } }

    function advance() {
      if (moving) return;
      if (step < QUESTIONS.length - 1) { step++; render(); }
      else finish();
    }

    async function finish() {
      if (sending) return;
      sending = true;
      $("bar").style.width = "100%";
      $("count").textContent = "";
      const payload = { email, _subject: "New JouleAI survey response", _replyto: email };
      for (const q of QUESTIONS) {
        const s = answers[q.id];
        if (!s) continue;
        const parts = s.picks.filter((p) => p !== "other");
        const written = s.other.trim();
        if (written && (q.type === "text" || s.picks.includes("other"))) parts.push(q.type === "text" ? written : `other: ${written}`);
        if (parts.length) payload[q.id] = parts.join(", ");
      }
      transition(() => { stage.innerHTML = `<div class="done"><h2 class="qtitle">sending…</h2></div>`; });
      try {
        await send(payload);
        status.textContent = "";
        transition(() => {
          stage.innerHTML = `<div class="done"><h2 class="qtitle">thank you.</h2><p>this genuinely shapes what we build. we'll be in touch soon.</p></div>`;
        });
      } catch (err) {
        console.error(err);
        transition(() => {
          stage.innerHTML = `<div class="done"><h2 class="qtitle">that didn't send.</h2><p>your answers are still here.</p><div class="nav" style="justify-content:center"><button type="button" class="next" id="retry">try again</button></div></div>`;
          $("retry").addEventListener("click", () => { sending = false; finish(); });
        });
      }
    }

    // keyboard: letters pick options, enter moves on, ← goes back
    document.addEventListener("keydown", (e) => {
      if (!survey.classList.contains("open") || sending) return;
      if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
      const q = current();
      if (e.key === "Enter") {
        e.preventDefault();
        if (!$("next").disabled) advance();
        return;
      }
      if (e.key === "ArrowLeft") { back(); return; }
      const i = KEYS.indexOf(e.key.toLowerCase());
      if (q.options && i >= 0 && i < q.options.length) pick(q.options[i]);
    });
  </script>
</body>
</html>
