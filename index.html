<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JouleAI — Your productivity partner</title>
  <meta name="description" content="JouleAI, your productivity partner. Coming soon — join the waitlist.">
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:title" content="JouleAI">
  <meta property="og:description" content="Your productivity partner. Coming soon.">
  <meta property="og:url" content="https://jouleai.vercel.app">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #ecebe6;
      --muted: #8a8984;
      --line: #2a2a2c;
      --accent: #e8c27a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 20px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    .badge {
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 36px;
    }
    .badge::before {
      content: "";
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 10px;
      vertical-align: middle;
      box-shadow: 0 0 12px var(--accent);
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(64px, 14vw, 128px);
      line-height: .95;
      letter-spacing: -.02em;
    }
    .tagline {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: clamp(22px, 4.5vw, 30px);
      color: var(--muted);
      margin-top: 14px;
    }
    form {
      margin-top: 56px;
      width: 100%;
      max-width: 420px;
      display: flex;
      border-bottom: 1px solid var(--line);
      transition: border-color .3s;
    }
    form:focus-within { border-color: var(--fg); }
    input[type="email"] {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--fg);
      font: inherit;
      font-size: 16px;
      padding: 14px 4px;
    }
    input::placeholder { color: var(--muted); }
    button {
      background: transparent;
      border: 0;
      color: var(--fg);
      font: inherit;
      font-size: 14px;
      letter-spacing: .04em;
      padding: 14px 4px 14px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s;
    }
    button:hover { color: var(--accent); }
    button:disabled { color: var(--muted); cursor: default; }
    .honey { position: absolute; left: -9999px; }
    .status {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
    }
    .status.ok { color: var(--accent); }
    footer {
      text-align: center;
      padding: 28px 0;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
    footer a:hover { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <p class="badge">Coming soon</p>
    <h1>JouleAI</h1>
    <p class="tagline">Your productivity partner.</p>

    <form id="waitlist" novalidate>
      <label for="email" class="honey">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      <input class="honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Join waitlist →</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <footer>
    © <span id="year"></span> JouleAI · <a href="mailto:tryjoule.ai@gmail.com">tryjoule.ai@gmail.com</a>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const form = document.getElementById("waitlist");
    const status = document.getElementById("status");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      status.className = "status";

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        status.textContent = "Please enter a valid email.";
        return;
      }
      if (form._honey.value) return; // bot

      button.disabled = true;
      status.textContent = "Joining…";

      try {
        const res = await fetch("https://formsubmit.co/ajax/tryjoule.ai@gmail.com", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            email,
            _subject: "New JouleAI waitlist signup",
            _template: "table",
            _replyto: email,
          }),
        });
        const data = await res.json();
        if (!res.ok || String(data.success) !== "true") throw new Error(data.message);
        form.reset();
        status.className = "status ok";
        status.textContent = "You're on the list. We'll be in touch.";
      } catch (err) {
        status.textContent = "Something went wrong. Please try again.";
        console.error(err);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
