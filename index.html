    :root {
      --bg: #0b0b0c;
      --fg: #ecebe6;
      --muted: #8a8984;
      --line: #2a2a2c;
      --card: #141415;
      --ease: cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 20px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 64px 0 24px;
      animation: rise 1.2s var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    h1 {
      display: flex;
      align-items: center;
      gap: .5em;
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(52px, 13vw, 96px);
      line-height: 1;
      letter-spacing: -.03em;
      transform: translateX(-.25em);
      transition: font-size .6s var(--ease);
    }
    h1 svg { height: .46em; width: auto; flex: none; transform: translateY(.06em); }
    .tagline {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: clamp(22px, 4.5vw, 30px);
      color: var(--muted);
      margin-top: 30px;
    }
    .badge {
      font-size: 13px;
      letter-spacing: .02em;
      color: var(--muted);
      margin-top: 48px;
    }
    /* compact hero once the survey is open */
    body.surveying h1 { font-size: clamp(32px, 8vw, 44px); }
    body.surveying .tagline, body.surveying .badge { display: none; }
    body.surveying main { justify-content: flex-start; padding-top: 48px; }

    #waitlist {
      margin-top: 20px;
      width: 100%;
      max-width: 360px;
      display: flex;
      border-bottom: 1px solid var(--line);
      transition: border-color .3s;
    }
    #waitlist:focus-within { border-color: var(--fg); }
    #waitlist input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--fg);
      font: inherit;
      font-size: 16px;
      padding: 14px 4px;
    }
    input::placeholder { color: var(--muted); }
    button {
      background: transparent;
      border: 0;
      font: inherit;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s, background .2s, border-color .2s, opacity .2s;
    }
    button:hover { color: var(--fg); }
    button:disabled { cursor: default; }
    #waitlist button { font-size: 14px; padding: 14px 4px 14px 16px; }
    .honey { position: absolute; left: -9999px; }
    .status {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
    }
    .status.ok { color: var(--fg); }

    #invite {
      width: 100%;
      max-width: 560px;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      line-height: 1.6;
    }
    #invite p { color: var(--muted); }
    #invite h2 { font-size: 14px; font-weight: 400; }
    #invite-link {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 8px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 12px;
    }
    .invite-actions { display: flex; align-items: center; gap: 20px; margin-top: 8px; }
    .invite-actions button { padding: 6px 0; font-size: 13px; color: var(--fg); }
    #invite-feedback { min-height: 21px; }

    /* ---------- survey ---------- */
    #survey {
      display: none;
      width: 100%;
      max-width: 560px;
      margin-top: 36px;
      text-align: left;
    }
    #survey.open { display: block; animation: rise .8s var(--ease) both; }
    .progress { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
    .bar { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .5s var(--ease); }
    .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }

    .stage { transition: opacity .22s ease, transform .22s ease; }
    .stage.out { opacity: 0; transform: translateY(-10px); }
    .stage.in { opacity: 0; transform: translateY(10px); transition: none; }

    .qtitle {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(26px, 5.5vw, 34px);
      line-height: 1.15;
      letter-spacing: -.01em;
    }
    .qhint { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 24px;
    }
    .options.single-col { grid-template-columns: 1fr; }
    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      font-size: 14px;
      color: var(--fg);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      white-space: normal;
    }
    .opt:hover { border-color: #4a4a4c; color: var(--fg); }
    .opt kbd {
      flex: none;
      display: grid;
      place-items: center;
      width: 22px; height: 22px;
      font: 400 11px "Inter", sans-serif;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      transition: inherit;
    }
    .opt[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .opt[aria-pressed="true"] kbd { color: var(--bg); border-color: rgba(0,0,0,.25); }
    .opt.pop { animation: pop .25s var(--ease); }
    @keyframes pop { 50% { transform: scale(.97); } }

    .other {
      display: none;
      width: 100%;
      margin-top: 12px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      outline: 0;
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      padding: 10px 2px;
      transition: border-color .3s;
    }
    .other.show { display: block; animation: rise .4s var(--ease) both; }
    .other:focus { border-color: var(--fg); }

    .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 32px; }
    .nav .left { display: flex; gap: 20px; }
    .nav button { font-size: 14px; padding: 8px 0; }
    .next {
      color: var(--bg) !important;
      background: var(--fg);
      border-radius: 999px;
      padding: 10px 22px !important;
    }
    .next:hover { opacity: .85; }
    .next:disabled { opacity: .3; }
    .next small { font-size: 11px; opacity: .55; margin-left: 8px; }
    [hidden] { display: none !important; }

    .done { text-align: center; padding: 40px 0; }
    .done p { color: var(--muted); font-size: 14px; margin-top: 10px; }

    @media (max-width: 480px) {
      .options { gap: 6px; margin-top: 20px; }
      .opt { font-size: 13px; padding: 11px 12px; border-radius: 10px; min-height: 48px; }
      .next small, .opt kbd { display: none; }
      .progress { margin-bottom: 28px; }
    }

    footer {
      text-align: center;
      padding: 28px 0;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--fg); }

    body.launching main, body.launching footer {
      animation: launch-reveal .45s var(--ease) 1.55s both;
    }
    @keyframes launch-reveal {
      from { opacity: 0; transform: scale(.96); }
      to { opacity: 1; transform: none; }
    }
    .launch-shield {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      touch-action: none;
    }
    .launch {
      position: absolute;
      inset: 0;
      background: #000;
      display: grid;
      place-items: center;
      overflow: hidden;
      touch-action: none;
      animation: launch-curtain .45s var(--ease) 1.55s both;
    }
    .launch-brand { display: grid; justify-items: center; gap: 24px; }
    .launch-wordmark {
      font-size: clamp(52px, 13vw, 96px);
      font-weight: 600;
      letter-spacing: -.03em;
      line-height: 1;
      animation: launch-wordmark 2s linear both;
    }
    .launch-mark {
      width: clamp(169px, 42.4vw, 312px);
      overflow: visible;
      animation: launch-exit .45s cubic-bezier(.4, 0, 1, 1) 1.1s both;
    }
    .launch-mark rect {
      animation: launch-square .52s both;
      animation-timing-function: cubic-bezier(.16, 1, .3, 1);
    }
    .launch-mark rect:nth-child(2) { animation-delay: .04s; }
    .launch-mark rect:nth-child(3) { animation-delay: .08s; }
    @keyframes launch-square {
      from { transform: translateX(-110vw); }
      to { transform: translateX(0); }
    }
    @keyframes launch-exit {
      from { transform: translateX(0); }
      to { transform: translateX(calc(50vw + 50% + 1px)); }
    }
    @keyframes launch-wordmark {
      0%, 25% { opacity: 0; transform: translateY(8px); }
      42.5%, 55% { opacity: 1; transform: none; }
      65%, 100% { opacity: 0; transform: none; }
    }
    @keyframes launch-curtain { to { transform: translateY(-100%); } }
    body.launch-skipped main, body.launch-skipped footer { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      body.launching main, body.launching footer {
        animation: launch-fade .4s linear .4s both;
      }
      .launch { animation: launch-fade .4s linear .4s reverse both; }
      .launch-wordmark { animation: none; }
      .launch-mark { display: none; }
      @keyframes launch-fade { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>

<body>
  <script>
    (() => {
      const shield = document.createElement('div');
      shield.className = 'launch-shield';
      shield.setAttribute('aria-hidden', 'true');
      const overlay = document.createElement('div');
      overlay.className = 'launch';
      overlay.setAttribute('aria-hidden', 'true');
      overlay.innerHTML = '<div class="launch-brand"><div class="launch-wordmark">joule AI</div><svg class="launch-mark" viewBox="0 0 99 42"><rect x="0" y="12" width="19" height="18" rx="4" fill="#545454"/><rect x="29" y="8" width="30" height="26" rx="6" fill="#9d9d9d"/><rect x="57" y="0" width="42" height="42" rx="10" fill="#fff"/></svg></div>';
      document.body.classList.add('launching');
      shield.append(overlay);
      document.body.append(shield);
      let timer;
      const finish = (event) => {
        if (event) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        clearTimeout(timer);
        document.body.classList.add('launch-skipped');
        document.body.classList.remove('launching');
        shield.remove();
        document.removeEventListener('click', finish, true);
        document.removeEventListener('keydown', finish, true);
      };
      document.addEventListener('click', finish, true);
      document.addEventListener('keydown', finish, true);
      timer = setTimeout(finish, matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2000);
    })();
  </script>

  <script>
    // Google Apps Script web app that appends rows to the waitlist sheet (see google-apps-script.js)
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbyOqeX_wQW6EzZ4f47lTuub34VT0I5sINtP6ij7EMhpo1oczrk7GmVPXOaG2ZTAWcEsOg/exec";

    // type: "one" = pick one (auto-advances), "many" = pick any (or up to max).
    // other: true lets people write their own answer.
    const QUESTIONS = [
      { id: "role", type: "one", title: "what best describes you?",
        options: ["student", "founder", "engineer / designer", "manager", "freelancer / creator", "other"], other: true },
      { id: "browser", type: "one", title: "which browser do you use most?",
        options: ["chrome", "safari", "arc", "brave", "edge / firefox", "other"], other: true },
      { id: "blockers", type: "many", title: "what gets in the way the most?", hint: "pick up to 3", max: 3,
        options: ["distractions & social media", "too many tabs & apps", "procrastination", "unclear priorities", "meetings & messages", "forgetting things", "other"], other: true },
      { id: "past_apps", type: "many", title: "why haven't productivity apps stuck for you?", hint: "pick all that apply",
        options: ["too much setup", "i forget to use them", "too complicated", "don't connect to my other apps", "never really tried one", "one works fine for me", "other"], other: true },
      { id: "features", type: "many", title: "what should joule do for you?", hint: "pick up to 3", max: 3,
        options: ["plan my day for me", "block distractions", "prioritise my tasks", "summarise emails & messages", "remind me at the right time", "an AI that acts across my apps", "other"], other: true },
      { id: "price", type: "one", title: "if joule nailed it, what would you pay?",
        options: ["free only", "under $5 / month", "$5–10 / month", "$10+ / month"] },
    ];

    const $ = (id) => document.getElementById(id);
    const form = $("waitlist"), status = $("status"), survey = $("survey"), stage = $("stage");
    const KEYS = "abcdefghijklmnopqrstuvwxyz";
    const answers = {}; // id -> { picks: [], other: "" }
    let email = "", step = 0, sending = false, moving = false, firstRender = true;

    const validRef = (value) => /^[a-zA-Z0-9_-]{1,64}$/.test(value || "");
    let ref = new URLSearchParams(location.search).get("ref") || "";
    if (!validRef(ref)) ref = "";
    try {
      if (ref) localStorage.setItem("joule-ref", ref);
      else {
        const stored = localStorage.getItem("joule-ref");
        if (validRef(stored)) ref = stored;
      }
    } catch {}

    const inviteCodes = new Map();
    function inviteCode(address) {
      const key = `joule-invite:${address.trim().toLowerCase()}`;
      if (inviteCodes.has(key)) return inviteCodes.get(key);
      let code;
      try { code = localStorage.getItem(key); } catch {}
      if (!/^j[a-z0-9]{10}$/.test(code || "")) {
        const bytes = crypto.getRandomValues(new Uint8Array(10));
        code = "j" + Array.from(bytes, (b) => (b % 36).toString(36)).join("");
        try { localStorage.setItem(key, code); } catch {}
      }
      inviteCodes.set(key, code);
      return code;
    }

    function showInvite(code) {
      $("invite-link").value = `https://jouleai.vercel.app/?ref=${code}`;
      $("share-invite").hidden = !navigator.share;
      $("invite").hidden = false;
    }

    $("copy-invite").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($("invite-link").value);
        $("invite-feedback").textContent = "copied";
      } catch {
        $("invite-link").focus();
        $("invite-link").select();
        $("invite-feedback").textContent = "couldn't copy. select and copy the link above.";
      }
    });

    $("share-invite").addEventListener("click", async () => {
      try {
        await navigator.share({
          title: "joule AI",
          text: "know someone who'd love joule AI? join the waitlist.",
          url: $("invite-link").value,
        });
      } catch (err) {
        if (err.name !== "AbortError") $("invite-feedback").textContent = "couldn't share. try copying the link instead.";
      }
    });

    async function send(payload) {
      // text/plain keeps this a simple request, so Apps Script needs no CORS preflight
      const res = await fetch(ENDPOINT, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
    }

    // ---------- waitlist ----------
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const value = form.email.value.trim();
      const button = form.querySelector("button");
      status.className = "status";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) { status.textContent = "please enter a valid email"; return; }
      if (form._honey.value) return; // bot

      button.disabled = true;
      status.textContent = "joining…";
      try {
        const code = inviteCode(value);
        await send({ type: "waitlist", email: value, ref, code });
        ref = "";
        try { localStorage.removeItem("joule-ref"); } catch {}
        email = value;
        form.style.display = "none";
        status.className = "status ok";
        status.textContent = "you're on the list. 6 quick taps to help shape joule?";
        startSurvey();
        showInvite(code);
      } catch (err) {
        status.textContent = "something went wrong. please try again.";
        console.error(err);
      } finally {
        button.disabled = false;
      }
    });

    // ---------- survey ----------
    function startSurvey() {
      document.body.classList.add("surveying");
      survey.classList.add("open");
      render();
    }

    const current = () => QUESTIONS[step];
    const state = (q) => (answers[q.id] ||= { picks: [], other: "" });

    function render() {
      const q = current(), s = state(q);
      const last = step === QUESTIONS.length - 1;
      $("bar").style.width = `${(step / QUESTIONS.length) * 100}%`;
      $("count").textContent = `${step + 1} / ${QUESTIONS.length}`;

      let body = `<h2 class="qtitle">${q.title}</h2>`;
      if (q.hint) body += `<p class="qhint">${q.hint}</p>`;
      const cols = q.options.length <= 6 ? " single-col" : "";
      body += `<div class="options${cols}">` + q.options.map((o, i) =>
        `<button type="button" class="opt" data-value="${o}" aria-pressed="${s.picks.includes(o)}"><kbd>${KEYS[i]}</kbd><span>${o}</span></button>`
      ).join("") + `</div>`;
      if (q.other) body += `<input class="other${s.picks.includes("other") ? " show" : ""}" id="otherInput" type="text" placeholder="write your own…">`;
      body += `<div class="nav">
        <div class="left">
          <button type="button" id="back"${step === 0 ? " hidden" : ""}>← back</button>
          <button type="button" id="skip">skip</button>
        </div>
        <button type="button" class="next" id="next">${last ? "finish" : "next"}<small>enter ↵</small></button>
      </div>`;

      transition(() => {
        stage.innerHTML = body;
        if (survey.getBoundingClientRect().top < 0) survey.scrollIntoView({ behavior: "smooth" });
        const other = $("otherInput");
        if (other) {
          other.value = s.other;
          other.addEventListener("input", () => { s.other = other.value; updateNext(); });
          other.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey && !$("next").disabled) { e.preventDefault(); advance(); }
          });
        }
        stage.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => pick(b.dataset.value)));
        $("back").addEventListener("click", back);
        $("skip").addEventListener("click", () => { delete answers[q.id]; advance(); });
        $("next").addEventListener("click", advance);
        updateNext();
      });
    }

    function transition(swap) {
      if (firstRender) { firstRender = false; swap(); return; }
      moving = true;
      stage.classList.add("out");
      setTimeout(() => {
        swap();
        stage.classList.remove("out");
        stage.classList.add("in");
        requestAnimationFrame(() => requestAnimationFrame(() => { stage.classList.remove("in"); moving = false; }));
      }, 200);
    }

    // next is enabled once something is picked (or written); skip is always there
    function updateNext() {
      const q = current(), s = state(q), btn = $("next");
      if (!btn) return;
      const wroteOther = s.other.trim() !== "";
      let ok = s.picks.length > 0;
      if (q.type === "one" && s.picks[0] === "other") ok = wroteOther;
      btn.disabled = !ok;
    }

    function pick(value) {
      if (moving) return;
      const q = current(), s = state(q);
      if (q.type === "one") {
        s.picks = [value];
      } else if (s.picks.includes(value)) {
        s.picks = s.picks.filter((p) => p !== value);
      } else {
        if (q.max && s.picks.length >= q.max) s.picks.shift();
        s.picks.push(value);
      }
      stage.querySelectorAll(".opt").forEach((b) => {
        if (b.dataset.value === value) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
        b.setAttribute("aria-pressed", s.picks.includes(b.dataset.value));
      });
      const other = $("otherInput");
      if (other) {
        const show = s.picks.includes("other");
        other.classList.toggle("show", show);
        if (show && value === "other") setTimeout(() => other.focus(), 30);
      }
      updateNext();
      if (q.type === "one" && value !== "other") { moving = true; setTimeout(() => { moving = false; advance(); }, 260); }
    }

    function back() { if (!moving && step > 0) { step--; render(); } }

    function advance() {
      if (moving) return;
      if (step < QUESTIONS.length - 1) { step++; render(); }
      else finish();
    }

    async function finish() {
      if (sending) return;
      sending = true;
      $("bar").style.width = "100%";
      $("count").textContent = "";
      const payload = { type: "survey", email };
      for (const q of QUESTIONS) {
        const s = answers[q.id];
        if (!s) continue;
        const parts = s.picks.filter((p) => p !== "other");
        const written = s.other.trim();
        if (written && s.picks.includes("other")) parts.push(`other: ${written}`);
        if (parts.length) payload[q.id] = parts.join(", ");
      }
      transition(() => { stage.innerHTML = `<div class="done"><h2 class="qtitle">sending…</h2></div>`; });
      try {
        await send(payload);
        status.textContent = "";
        transition(() => {
          stage.innerHTML = `<div class="done"><h2 class="qtitle">thank you.</h2><p>this genuinely shapes what we build. we'll be in touch soon.</p></div>`;
        });
      } catch (err) {
        console.error(err);
        transition(() => {
          stage.innerHTML = `<div class="done"><h2 class="qtitle">that didn't send.</h2><p>your answers are still here.</p><div class="nav" style="justify-content:center"><button type="button" class="next" id="retry">try again</button></div></div>`;
          $("retry").addEventListener("click", () => { sending = false; finish(); });
        });
      }
    }

    // keyboard: letters pick options, enter moves on, ← goes back
    document.addEventListener("keydown", (e) => {
      if (!survey.classList.contains("open") || sending) return;
      if (e.target.closest("#invite")) return;
      if (e.target.matches("input") || e.metaKey || e.ctrlKey || e.altKey) return;
      const q = current();
      if (e.key === "Enter") {
        e.preventDefault();
        if (!$("next").disabled) advance();
        return;
      }
      if (e.key === "ArrowLeft") { back(); return; }
      const i = KEYS.indexOf(e.key.toLowerCase());
      if (i >= 0 && i < q.options.length) pick(q.options[i]);
    });
  </script>
</body>
</html>
