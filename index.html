<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>joule AI — less managing, more doing</title>
  <meta name="description" content="joule AI, less managing, more doing. coming soon — join the waitlist.">
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:title" content="joule AI">
  <meta property="og:description" content="less managing, more doing. coming soon.">
  <meta property="og:url" content="https://jouleai.vercel.app">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #ecebe6;
      --muted: #8a8984;
      --line: #2a2a2c;
      --accent: #e8c27a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 20px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 64px 0 24px;
      animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    .badge {
      font-size: 13px;
      letter-spacing: .02em;
      color: var(--muted);
      margin-top: 48px;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: .5em;
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(52px, 13vw, 96px);
      line-height: 1;
      letter-spacing: -.03em;
      transform: translateX(-.25em);
    }
    h1 svg { height: .46em; width: auto; flex: none; transform: translateY(.06em); }
    .tagline {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: clamp(22px, 4.5vw, 30px);
      color: var(--muted);
      margin-top: 30px;
    }
    form {
      margin-top: 20px;
      width: 100%;
      max-width: 360px;
      display: flex;
      border-bottom: 1px solid var(--line);
      transition: border-color .3s;
    }
    form:focus-within { border-color: var(--fg); }
    input[type="email"] {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--fg);
      font: inherit;
      font-size: 16px;
      padding: 14px 4px;
    }
    input::placeholder { color: var(--muted); }
    button {
      background: transparent;
      border: 0;
      font: inherit;
      font-size: 14px;
      color: var(--muted);
      padding: 14px 4px 14px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s;
    }
    button:hover { color: var(--fg); }
    button:disabled { color: var(--muted); cursor: default; }
    .honey { position: absolute; left: -9999px; }
    .status {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
    }
    .status.ok { color: var(--fg); }
    footer {
      text-align: center;
      padding: 28px 0;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--fg); }
    #survey {
      display: none;
      flex-direction: column;
      gap: 26px;
      max-width: 460px;
      margin-top: 28px;
      border: 0;
      text-align: left;
    }
    #survey.open { display: flex; animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    #survey:focus-within { border: 0; }
    .survey-intro { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .survey-intro em { font-family: "Instrument Serif", Georgia, serif; font-size: 22px; color: var(--fg); display: block; margin-bottom: 4px; }
    .q { display: flex; flex-direction: column; gap: 8px; }
    .q > span { font-size: 14px; color: var(--fg); }
    .q input[type="text"], .q textarea {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      outline: 0;
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      padding: 8px 2px;
      resize: none;
      transition: border-color .3s;
    }
    .q input[type="text"]:focus, .q textarea:focus { border-color: var(--fg); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips label { cursor: pointer; }
    .chips input { position: absolute; opacity: 0; pointer-events: none; }
    .chips span {
      display: inline-block;
      font-size: 13px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      transition: color .2s, border-color .2s;
    }
    .chips label:hover span { color: var(--fg); }
    .chips input:checked + span { color: var(--bg); background: var(--fg); border-color: var(--fg); }
    .chips input:focus-visible + span { outline: 1px solid var(--fg); outline-offset: 2px; }
    .survey-actions { display: flex; justify-content: space-between; align-items: center; }
    .survey-actions button { padding: 10px 0; }
    .survey-actions .send {
      color: var(--bg);
      background: var(--fg);
      border-radius: 999px;
      padding: 10px 22px;
    }
    .survey-actions .send:hover { color: var(--bg); opacity: .85; }
  </style>
</head>
<body>
  <main>
    <h1 aria-label="joule AI">
      <svg viewBox="0 0 99 42" aria-hidden="true"><rect x="0" y="12" width="19" height="18" rx="4" fill="#545454"/><rect x="29" y="8" width="30" height="26" rx="6" fill="#9d9d9d"/><rect x="57" y="0" width="42" height="42" rx="10" fill="currentColor"/></svg>
      <span>joule AI</span>
    </h1>
    <p class="tagline">less managing, more doing</p>
    <p class="badge">coming soon</p>

    <form id="waitlist" novalidate>
      <label for="email" class="honey">email</label>
      <input id="email" name="email" type="email" placeholder="your email" autocomplete="email" required>
      <input class="honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">join waitlist</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <form id="survey" novalidate>
      <p class="survey-intro"><em>help us build joule</em>a few quick questions. answer as many as you like.</p>

      <div class="q">
        <span>which browser do you use most?</span>
        <div class="chips">
          <label><input type="radio" name="browser" value="chrome"><span>chrome</span></label>
          <label><input type="radio" name="browser" value="safari"><span>safari</span></label>
          <label><input type="radio" name="browser" value="arc"><span>arc</span></label>
          <label><input type="radio" name="browser" value="firefox"><span>firefox</span></label>
          <label><input type="radio" name="browser" value="edge"><span>edge</span></label>
          <label><input type="radio" name="browser" value="brave"><span>brave</span></label>
          <label><input type="radio" name="browser" value="other"><span>other</span></label>
        </div>
      </div>

      <label class="q"><span>which apps do you use every day?</span>
        <input type="text" name="apps" placeholder="e.g. notion, slack, gmail"></label>

      <label class="q"><span>how do you stay productive right now?</span>
        <textarea name="current_system" rows="2" placeholder="to-do lists, calendar blocking, nothing…"></textarea></label>

      <label class="q"><span>what gets in the way of being productive?</span>
        <textarea name="problems" rows="2"></textarea></label>

      <label class="q"><span>have you tried other productivity apps? which ones?</span>
        <input type="text" name="tried_apps" placeholder="e.g. todoist, motion, sunsama"></label>

      <label class="q"><span>what didn't work about them?</span>
        <textarea name="what_failed" rows="2"></textarea></label>

      <label class="q"><span>what would actually make you more productive?</span>
        <textarea name="ideas" rows="2"></textarea></label>

      <div class="survey-actions">
        <button type="button" id="skip">skip</button>
        <button type="submit" class="send">send answers</button>
      </div>
    </form>
  </main>

  <footer>
    <a href="mailto:tryjoule.ai@gmail.com">tryjoule.ai@gmail.com</a>
  </footer>

  <script>
    const form = document.getElementById("waitlist");
    const status = document.getElementById("status");
    const button = form.querySelector("button");
    const survey = document.getElementById("survey");
    const ENDPOINT = "https://formsubmit.co/ajax/tryjoule.ai@gmail.com";
    let signupEmail = "";

    async function send(payload) {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ _template: "table", ...payload }),
      });
      const data = await res.json();
      if (!res.ok || String(data.success) !== "true") throw new Error(data.message);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      status.className = "status";

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        status.textContent = "please enter a valid email";
        return;
      }
      if (form._honey.value) return; // bot

      button.disabled = true;
      status.textContent = "joining…";

      try {
        await send({ email, _subject: "New JouleAI waitlist signup", _replyto: email });
        signupEmail = email;
        form.style.display = "none";
        status.className = "status ok";
        status.textContent = "you're on the list. we'll be in touch.";
        survey.classList.add("open");
      } catch (err) {
        status.textContent = "something went wrong. please try again.";
        console.error(err);
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("skip").addEventListener("click", () => survey.classList.remove("open"));

    survey.addEventListener("submit", async (e) => {
      e.preventDefault();
      const answers = Object.fromEntries(new FormData(survey));
      const sendBtn = survey.querySelector(".send");
      sendBtn.disabled = true;
      try {
        await send({ email: signupEmail, _subject: "New JouleAI survey response", _replyto: signupEmail, ...answers });
        survey.classList.remove("open");
        status.textContent = "thank you. this really helps.";
      } catch (err) {
        sendBtn.disabled = false;
        sendBtn.textContent = "try again";
        console.error(err);
      }
    });
  </script>
</body>
</html>
